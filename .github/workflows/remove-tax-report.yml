name: 세무 기존 보고서 1건 제거

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accounting-briefing-generation
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove unwanted tax report only
        run: python remove_old_tax_report.py
      - name: Commit deletion and prevent re-publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json tax_excluded_reports.json
          git add -u briefings/
          if ! git diff --cached --quiet; then
            git commit -m "Remove irrelevant 2026-10-28 tax briefing"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

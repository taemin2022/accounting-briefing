name: Apply verified three-column layout V3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply CSS-only desktop layout
        run: python apply_layout_v3.py
      - name: Verify source contains layout rules
        run: |
          grep -q 'THREE_COLUMN_LAYOUT_V3_BEGIN' index.html
          grep -q 'grid-template-columns: minmax(260px, 305px)' index.html
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Apply CSS-only three-column desktop layout V3'
          git push

name: 금융감독원 일일 공식 API 브리핑

on:
  schedule:
    - cron: '30 0 * * *'  # 09:30 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: accounting-briefing-generation
  cancel-in-progress: false

jobs:
  generate-fss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate FSS briefing from official API
        env:
          FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
        run: python fss_api.py
      - name: Save published report
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json briefings/
          if ! git diff --cached --quiet; then
            git commit -m "Publish official FSS daily briefing"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy updated website
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main

name: Apply three-column layout V4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply layout V4 with DOM checks
        run: python apply_layout_v4.py
      - name: Verify actual HTML selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'THREE_COLUMN_LAYOUT_V4_BEGIN' in s
          assert '.dashboard > .quicklinks {' in s
          assert '.dashboard > .sidebar {' in s
          assert '.dashboard > .archive {' in s
          print('V4 selectors verified')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No new changes'
          else
            git commit -m 'Fix dashboard direct-child layout V4'
            git push origin HEAD:main
          fi

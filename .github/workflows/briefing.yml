name: AI 브리핑 생성 및 사이트 게시

# First stage: manual runs only. After validation, schedule can be enabled.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: '어떤 브리핑을 생성할까요?'
        type: choice
        options:
          - fss
          - ifrs
          - security
          - weekly
        required: true
        default: fss

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: accounting-briefing-deployment
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate briefing (OpenAI API)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
        run: python briefing.py --kind "${{ inputs.kind }}"
      - name: Save new files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json briefings/
          if ! git diff --cached --quiet; then
            git commit -m "Publish AI briefing"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

name: AI 브리핑 수동 생성

# FSS remains manual until its official API is connected.
# Weekly briefing jobs have independent schedules in separate workflows.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: '어떤 브리핑을 생성할까요?'
        type: choice
        options:
          - fss
          - ifrs
          - security
          - weekly
        required: true
        default: fss

permissions:
  contents: write

concurrency:
  group: accounting-briefing-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate requested briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
          RUN_KIND: ${{ inputs.kind }}
        run: python briefing.py --kind "$RUN_KIND"
      - name: Save reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json briefings/
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${{ inputs.kind }} briefing"
            git push
          fi
# Existing deploy-site.yml deploys whenever posts.json or briefings/ changes.
